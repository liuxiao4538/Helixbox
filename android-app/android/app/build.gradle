// App 模块 Gradle 配置（Flutter 3.x 标准）
plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.xboxdownload_controller'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.xboxdownload_controller"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // V1 用 debug 签名，正式上架再配 keystore
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

flutter {
    source '../..'
}
