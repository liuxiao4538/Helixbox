name: Build Helixbox & Release

# 触发：推送 v* 标签（如 v1.0.0）。云端装 Flutter+JDK，编译 Android APK，
# 连同本机已构建好的多架构 ipk/apk 一起发到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  metadata: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure repository About (description / topics)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              description: 'Helixbox — 软路由一键加速 Xbox/商店/PS/NS 下载（国内 CDN 跳转 + v3 并发测速）+ Android 遥控器',
              homepage: 'https://github.com/liuxiao4538/Helixbox',
            });
            try {
              await github.rest.repos.replaceAllTopics({
                owner: context.repo.owner,
                repo: context.repo.repo,
                names: ['flutter', 'openwrt', 'xbox', 'cdn', 'accelerator', 'android', 'luci', 'speedtest'],
              });
            } catch (e) { core.warning('topics 设置跳过: ' + e.message); }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Android SDK license
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Flutter pub get
        working-directory: android-app
        run: flutter pub get

      - name: Build release APK
        working-directory: android-app
        run: flutter build apk --release

      - name: Build debug APK
        working-directory: android-app
        run: flutter build apk --debug

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          cp android-app/build/app/outputs/flutter-apk/app-release.apk \
             release-assets/Helixbox-v${GITHUB_REF_NAME}-android-release.apk
          cp android-app/build/app/outputs/flutter-apk/app-debug.apk \
             release-assets/Helixbox-v${GITHUB_REF_NAME}-android-debug.apk

      - name: Build router packages (ipk + apk, multi-arch)
        run: python3 openwrt/helixbox/build_packages.py

      - name: Collect router packages (flatten with unique names)
        run: |
          # 扁平化到单层目录，文件名带架构前缀，避免同名覆盖
          for f in openwrt/helixbox/dist/ipk/*/*.ipk; do
            [ -f "$f" ] || continue
            arch=$(basename "$(dirname "$f")")
            cp "$f" "release-assets/ipk-${arch}-$(basename "$f")"
          done
          for f in openwrt/helixbox/dist/apk/*/*.apk; do
            [ -f "$f" ] || continue
            arch=$(basename "$(dirname "$f")")
            cp "$f" "release-assets/apk-${arch}-$(basename "$f")"
          done
          echo "=== release-assets 内容 ==="
          ls -lh release-assets/

      - name: Create Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: Helixbox ${{ github.ref_name }}
          body: |
            ## Helixbox ${{ github.ref_name }}
            XboxDownload 原理 + v3 并发测速的软路由加速插件与 Android 遥控器。

            ### 手机 App（两个版本，任选其一安装）
            - `Helixbox-v*-android-release.apk` —— release 版（推荐，体积更小）
            - `Helixbox-v*-android-debug.apk` —— debug 版（便于排查问题）
            - 均为通用 APK，支持 arm64-v8a / armeabi-v7a 安卓手机

            ### 软路由插件（纯脚本，架构通用；按目录区分固件版本）
            - `ipk/<架构>/` —— OpenWrt **24.10 及更早**（opkg），文件名 `luci-app-helixbox_1.0.0_<arch>.ipk`
            - `apk/<架构>/` —— OpenWrt **25.12 及更新**（apk-tools），文件名 `luci-app-helixbox-1.0.0-r1.apk`
            - `noarch/` 与 `all/` —— 通用包（脚本插件一份通吃）

            架构目录：`x86_64`、`aarch64_cortex-a53`、`aarch64_cortex-a72`、`arm_cortex-a7_neon-vfpv4`。
            不确定架构就在路由器执行 `uname -m` 查看。

            ### 安装
            手机：下载 APK 直接安装，连家里 WiFi 后添加路由器（地址填 `路由器IP:8080`）。
            软路由：`opkg install xxx.ipk`（24.10）或 `apk add --allow-untrusted xxx.apk`（25.12）。
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
