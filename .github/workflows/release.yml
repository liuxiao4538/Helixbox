name: Build Helixbox & Release

# 触发：推送 v* 标签（如 v1.0.0）。云端装 Flutter+JDK，编译 Android APK，
# 连同本机已构建好的多架构 ipk/apk 一起发到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Android SDK license
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Flutter pub get
        working-directory: android-app
        run: flutter pub get

      - name: Build release APK
        working-directory: android-app
        run: flutter build apk --release

      - name: Build debug APK
        working-directory: android-app
        run: flutter build apk --debug

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          cp android-app/build/app/outputs/flutter-apk/app-release.apk \
             release-assets/Helixbox-${GITHUB_REF_NAME}-android-release.apk
          # debug APK 约 88MB，若接近 GitHub 单文件上限则跳过（本地已产出）
          if [ -f android-app/build/app/outputs/flutter-apk/app-debug.apk ]; then
            sz=$(stat -c%s android-app/build/app/outputs/flutter-apk/app-debug.apk)
            if [ "$sz" -lt 95000000 ]; then
              cp android-app/build/app/outputs/flutter-apk/app-debug.apk \
                 release-assets/Helixbox-${GITHUB_REF_NAME}-android-debug.apk
            else
              echo "debug APK ${sz} bytes 过大，跳过上传"
            fi
          fi

      - name: Build router packages (ipk + apk, multi-arch)
        run: python3 openwrt/helixbox/build_packages.py

      - name: Collect router packages (unified names)
        run: |
          # 文件名已由 build_packages.py 统一为 luci-app-helixbox-1.0.0-<arch>.ipk/.apk，
          # 且各架构名不同，直接复制不会重名，无需加前缀
          for f in openwrt/helixbox/dist/ipk/*/*.ipk; do
            [ -f "$f" ] && cp "$f" release-assets/
          done
          for f in openwrt/helixbox/dist/apk/*/*.apk; do
            [ -f "$f" ] && cp "$f" release-assets/
          done
          echo "=== release-assets 内容 ==="
          ls -lh release-assets/

      - name: Delete old release (remove duplicate assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只删 Release，保留 tag；这样重建后附件干净不重复
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || echo "无旧 Release，跳过"

      - name: Create Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: Helixbox ${{ github.ref_name }}
          body: |
            ## Helixbox ${{ github.ref_name }}
            XboxDownload 原理 + v3 并发测速的软路由加速插件与 Android 遥控器。

            ### 手机 App（可选，遥控器）
            - `Helixbox-${{ github.ref_name }}-android-release.apk` —— 手机安装包（推荐）

            ### 软路由插件（统一命名：luci-app-helixbox-1.0.0-<架构>.<格式>）
            **按固件版本选后缀**：
            - `.apk` —— OpenWrt **25.12 及更新**（apk-tools）
            - `.ipk` —— OpenWrt **24.10 及更早**（opkg）

            **按架构选名字**（插件是纯脚本，架构通用；`all`/`noarch` 是通用包）：
            - `x86_64`（x86 软路由）
            - `aarch64_cortex-a53` / `aarch64_cortex-a72`（ARM64 软路由）
            - `arm_cortex-a7_neon-vfpv4`（ARMv7）
            - `all`（ipk 通用）/ `noarch`（apk 通用）

            例如：`luci-app-helixbox-1.0.0-x86_64.apk`。不确定架构就在路由器执行 `uname -m`。

            ### 安装
            手机：下载 APK 直接安装，连家里 WiFi 后添加路由器（地址填 `路由器IP:8080`）。
            软路由：`opkg install xxx.ipk`（24.10）或 `apk add --allow-untrusted xxx.apk`（25.12）。
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
