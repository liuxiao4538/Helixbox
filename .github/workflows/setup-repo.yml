name: Configure Helixbox Repository About

# 手动触发或随 main 推送，设置仓库"关于"区域的描述、主页、topics
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/setup-repo.yml'

permissions:
  contents: read
  repository-projects: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set description & homepage
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              description: 'Helixbox — 软路由一键加速 Xbox/商店/PS/NS 下载（国内 CDN 跳转 + v3 并发测速）+ Android 遥控器',
              homepage: 'https://github.com/liuxiao4538/Helixbox',
            });
            core.info('描述与主页已设置');

      - name: Set topics
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: ['flutter', 'openwrt', 'xbox', 'cdn', 'accelerator', 'android', 'luci', 'speedtest'],
            });
            core.info('topics 已设置');
