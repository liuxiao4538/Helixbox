name: Configure Helixbox Repository About

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/setup-repo.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set description & homepage via gh api
        run: |
          gh api -X PATCH repos/liuxiao4538/Helixbox \
            -f description='Helixbox — 软路由一键加速 Xbox/商店/PS/NS 下载（国内 CDN 跳转 + v3 并发测速）+ Android 遥控器' \
            -f homepage='https://github.com/liuxiao4538/Helixbox' \
            && echo "OK: description/homepage 已设置"

      - name: Set topics (best effort)
        continue-on-error: true
        run: |
          gh api -X PUT repos/liuxiao4538/Helixbox/topics \
            -f 'names[]=flutter' -f 'names[]=openwrt' -f 'names[]=xbox' \
            -f 'names[]=cdn' -f 'names[]=accelerator' -f 'names[]=android' \
            -f 'names[]=luci' -f 'names[]=speedtest' \
            && echo "OK: topics 已设置"
